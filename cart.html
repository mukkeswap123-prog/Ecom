<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Review and update your WearCulture shopping cart." />
    <title>Cart — WearCulture</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="cart.css" />
    <script src="cart.js" defer></script>
  </head>
  <body class="cart-body">
    <header class="site-header">
      <div class="brand-area">
        <a class="wordmark" href="index.html" aria-label="WearCulture home"><span>Wear</span><span>Culture</span></a>
      </div>

      <nav class="primary-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="collection.html">Collection</a>
        <a href="cart.html" aria-current="page">Cart</a>
        <a href="account.html">Account</a>
      </nav>

    </header>

    <main class="cart-page">
      <section class="cart-heading" aria-labelledby="cart-title">
        <p class="cart-eyebrow">Your selection</p>
        <h1 id="cart-title">Shopping cart <span id="cart-item-count">0 items</span></h1>
      </section>

      <div class="cart-layout">
        <section class="cart-items-panel" aria-labelledby="cart-items-title">
          <div class="cart-panel-heading">
            <h2 id="cart-items-title">Cart items</h2>
            <!--<a href="collection.html">Continue shopping <span aria-hidden="true">↗</span></a>-->
          </div>

          <div id="cart-items" aria-live="polite"></div>
          <div id="cart-empty" class="cart-empty" hidden>
            <span class="cart-empty-icon" aria-hidden="true">◇</span>
            <h3>Your cart is empty</h3>
            <p>Find something you love and it will appear here.</p>
            <a class="cart-primary-link" href="collection.html">Explore the collection</a>
          </div>
        </section>

        <aside class="cart-summary" aria-labelledby="cart-summary-title">
          <h2 id="cart-summary-title">Order summary</h2>
          <dl class="cart-summary-lines">
            <div>
              <dt>Product MRP</dt>
              <dd id="cart-product-mrp">₹0</dd>
            </div>
            <div>
              <dt>Delivery charges</dt>
              <dd id="cart-delivery-charges">₹0</dd>
            </div>
            <div>
              <dt>Coupon discount</dt>
              <dd id="cart-coupon-discount">₹0</dd>
            </div>
            <div class="cart-total">
              <dt>Total</dt>
              <dd id="cart-total">₹0</dd>
            </div>
          </dl>
          <button class="cart-checkout" type="button" disabled>Proceed</button>
          <!-- <p class="cart-checkout-note">Your cart is saved on this device.</p> -->
        </aside>
      </div>
    </main>
  </body>
</html>
